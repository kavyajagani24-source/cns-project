[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "dnspython>=2.9.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "motor>=3.7.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "opencv-python-headless>=4.10.0",
    "aiofiles>=23.0.0",
    "uvicorn[standard]>=0.54.0",
    "torch==2.4.1+cu121",
    "torchvision==0.19.1+cu121",
    "timm>=0.9",
    "fvcore>=0.1.5.post20221221",
    "simplejson>=4.2.0",
    "torchmetrics>=1.9.0",
    "pytorch-losses>=0.0.1",
    "gdown>=6.4.2",
    "einops>=0.8.2",
    "matplotlib>=3.11.2",
    "filterpy>=1.4.5",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.16.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple/"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu121"
default = true
